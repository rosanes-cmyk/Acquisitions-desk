<!--
  Styles.html - the Acquisitions Desk control room.

  Committed to a single dark world, on purpose. Twin Home Buyer's navy
  (#051531) is already almost black, so the brand IS the canvas; the orange
  (#ff924c) is the only warm thing on screen and therefore reads as signal
  wherever it appears. A light variant would spend that.

  Montserrat 800/900 display · Inter 400-600 UI · IBM Plex Mono data.
  Included by Index.html through include_('Styles').
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* ══════════════════════════════════════════════════════════════════════
     THB Acquisitions Desk — control room

     Committed to a single dark world, on purpose. Twin Home Buyer's navy
     (#051531) is already almost black, so the brand IS the canvas; the
     orange (#ff924c) is the only warm thing on screen and therefore reads
     as signal wherever it appears. A light variant would spend that.

     Montserrat 800/900 display · Inter 400–600 UI · IBM Plex Mono data.
     ══════════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: dark;

    --canvas:#040b16;
    --s1:#09131f;
    --s2:#0d1a2b;
    --s3:#12233a;
    --hair:rgba(255,255,255,.065);
    --hair2:rgba(255,255,255,.12);

    --tx:#eaf1f9;
    --tx2:#93a8c1;
    --tx3:#5c7089;

    --orange:#ff924c;
    --orange2:#ffbc90;
    --glow:rgba(255,146,76,.16);

    --green:#3ddc97;
    --green-dim:rgba(61,220,151,.12);
    --red:#ff7070;
    --red-dim:rgba(255,112,112,.12);
    --steel:#31496b;

    --display:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;
    --ui:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --panel-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 22px 48px -26px rgba(0,0,0,.95);
    --r:15px;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    background:
      radial-gradient(1100px 520px at 76% -8%, rgba(255,146,76,.075), transparent 62%),
      radial-gradient(880px 440px at 6% 0%, rgba(49,73,107,.30), transparent 58%),
      var(--canvas);
    background-attachment:fixed;
    color:var(--tx);
    font-family:var(--ui);
    font-size:14.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button, input, select, textarea { font:inherit; color:inherit; }
  ::selection { background:var(--glow); color:#fff; }
  :focus-visible { outline:2px solid var(--orange); outline-offset:2px; border-radius:6px; }

  @media (prefers-reduced-motion:no-preference) {
    .panel, .btn, .tab, .lead, .kpi, .toolcard, .qitem { transition:
      background-color .16s ease, border-color .16s ease, box-shadow .2s ease,
      transform .16s ease, color .16s ease; }
  }

  .wrap { max-width:1180px; margin:0 auto; padding-inline:22px; padding-block:26px 84px; }

  /* ───────────────────────── masthead ───────────────────────── */
  .mast { position:sticky; top:0; z-index:40; background:rgba(4,11,22,.86);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    border-bottom:1px solid var(--hair); }
  .mast-in { max-width:1180px; margin:0 auto; padding:15px 22px;
    display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; }

  .brand { flex:1 1 250px; display:flex; align-items:center; gap:13px; min-width:0; }
  .mark { width:40px; height:40px; flex:none; border-radius:11px;
    background:linear-gradient(158deg, var(--orange2), var(--orange) 52%, #e8762f);
    display:grid; place-items:center; font-family:var(--display); font-weight:900;
    font-size:14.5px; color:#2a1002; letter-spacing:-.045em;
    box-shadow:0 0 0 1px rgba(255,255,255,.13) inset, 0 7px 20px -6px rgba(255,146,76,.55); }
  .kicker { font-size:9px; font-weight:700; letter-spacing:.24em; text-transform:uppercase;
    color:var(--orange); margin-bottom:2px; }
  .brand h1 { font-family:var(--display); font-weight:800; font-size:19.5px;
    letter-spacing:-.026em; margin:0; line-height:1.1; }

  .who { display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .ident { font-size:12.5px; color:var(--tx2); white-space:nowrap; }
  .ident b { color:var(--tx); font-weight:600; }
  .role-pill { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.09em;
    background:var(--glow); color:var(--orange2); padding:3px 9px; border-radius:5px;
    border:1px solid rgba(255,146,76,.26); }
  .mast select { background:var(--s2); border:1px solid var(--hair2); color:var(--tx2);
    border-radius:8px; padding:6px 10px; font-size:12.5px; width:auto; }
  .mast select option { background:#0d1a2b; color:var(--tx); }

  .saveind { font-family:var(--mono); font-size:11px; color:var(--tx3); min-width:62px;
    text-align:right; letter-spacing:.03em; }
  .saveind.on { color:var(--orange); }
  .saveind.ok { color:var(--green); }
  .saveind.bad { color:var(--red); }

  .btn-ghost { background:var(--s2); border:1px solid var(--hair2); color:var(--tx2);
    padding:7px 14px; border-radius:9px; font-size:12.5px; font-weight:500; cursor:pointer; }
  .btn-ghost:hover { background:var(--s3); color:var(--tx); border-color:rgba(255,255,255,.2); }

  /* ───────────────────────── tabs ───────────────────────── */
  .tabbar { position:sticky; top:70px; z-index:30; background:rgba(4,11,22,.86);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--hair); }
  .tabs { max-width:1180px; margin:0 auto; padding:0 22px; display:flex; gap:3px;
    overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { position:relative; background:none; border:none; padding:13px 15px;
    font-size:13.5px; font-weight:550; color:var(--tx3); cursor:pointer; white-space:nowrap; }
  .tab:hover { color:var(--tx2); }
  .tab[aria-selected="true"] { color:var(--tx); }
  .tab[aria-selected="true"]::after { content:""; position:absolute; left:15px; right:15px;
    bottom:-1px; height:2px; border-radius:2px; background:var(--orange);
    box-shadow:0 0 14px 1px rgba(255,146,76,.75); }

  /* ───────────────────────── panels ───────────────────────── */
  .panel { position:relative; border-radius:var(--r); border:1px solid var(--hair);
    background:linear-gradient(180deg, rgba(255,255,255,.032), rgba(255,255,255,0) 140px),
      var(--s1);
    box-shadow:var(--panel-shadow); margin-top:22px; overflow:hidden; }
  .panel > h2 { display:flex; align-items:center; gap:10px;
    font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--tx3); margin:0; padding:16px 22px 14px; border-bottom:1px solid var(--hair); }
  .panel > h2::before { content:""; width:5px; height:5px; border-radius:50%;
    background:var(--orange); box-shadow:0 0 9px 1px var(--glow); flex:none; }
  .panel-body { padding:22px; }

  /* ───────────────────────── day strip ───────────────────────── */
  .daystrip { display:flex; flex-wrap:wrap; align-items:center; gap:22px 34px;
    padding:22px 24px; border-radius:var(--r); border:1px solid var(--hair);
    background:linear-gradient(112deg, rgba(255,146,76,.10), rgba(255,255,255,.02) 42%,
      rgba(255,255,255,0)), var(--s1);
    box-shadow:var(--panel-shadow); }
  .daystrip .date { flex:1 1 240px; min-width:0; }
  .daystrip .date .dow { font-family:var(--display); font-weight:900; font-size:29px;
    letter-spacing:-.035em; line-height:1.05; }
  .daystrip .date .tz { font-family:var(--mono); font-size:11px; color:var(--tx3);
    margin-top:4px; letter-spacing:.04em; }
  .dsfig { min-width:92px; }
  .dsfig dt { font-size:9.5px; font-weight:700; letter-spacing:.17em; text-transform:uppercase;
    color:var(--tx3); }
  .dsfig dd { margin:5px 0 0; font-family:var(--display); font-weight:800; font-size:26px;
    letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:1; }
  .dsfig dd.accent { color:var(--orange); }
  .dsfig dd.good { color:var(--green); }
  .dsfig .u { font-size:12px; color:var(--tx3); font-family:var(--ui); font-weight:500;
    margin-left:3px; letter-spacing:0; }

  /* ───────────────────────── log groups ───────────────────────── */
  .loggroup { padding:18px 0; border-bottom:1px solid var(--hair); }
  .loggroup:first-child { padding-top:0; }
  .loggroup:last-child { border-bottom:none; padding-bottom:0; }
  .loghead { display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    margin-bottom:13px; flex-wrap:wrap; }
  .loghead h3 { font-size:10px; font-weight:700; letter-spacing:.19em; text-transform:uppercase;
    color:var(--tx3); margin:0; }
  .loghead .live { font-family:var(--display); font-weight:800; font-size:19px;
    letter-spacing:-.03em; color:var(--orange); font-variant-numeric:tabular-nums; }
  .loghead .live small { font-family:var(--ui); font-size:10px; font-weight:600;
    letter-spacing:.13em; text-transform:uppercase; color:var(--tx3); margin-right:7px; }
  .fieldgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:12px; }

  label.field { display:block; font-size:9.5px; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--tx3); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    width:100%; background:var(--s2); border:1px solid var(--hair2); border-radius:9px;
    padding:9px 11px; font-size:14px; color:var(--tx);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.32); }
  input::placeholder, textarea::placeholder { color:var(--tx3); }
  input:hover, select:hover, textarea:hover { border-color:rgba(255,255,255,.2); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--orange);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.3), 0 0 0 3px var(--glow); }
  input:disabled, select:disabled, textarea:disabled { opacity:.45; cursor:not-allowed; }
  input[type=number] { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ───────────────────────── buttons ───────────────────────── */
  .btn { background:var(--s2); border:1px solid var(--hair2); color:var(--tx);
    padding:8px 15px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer; }
  .btn:hover { background:var(--s3); border-color:rgba(255,255,255,.22); }
  .btn-primary { background:linear-gradient(178deg, var(--orange2), var(--orange) 46%, #ef7c33);
    border-color:transparent; color:#2c1102; font-weight:700;
    box-shadow:0 0 0 1px rgba(255,255,255,.16) inset, 0 8px 20px -8px rgba(255,146,76,.7); }
  .btn-primary:hover { filter:brightness(1.07); transform:translateY(-1px); }
  .btn-sm { padding:5px 11px; font-size:12.5px; border-radius:7px; }

  /* ───────────────────────── chips ───────────────────────── */
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:550;
    padding:4px 10px; border-radius:7px; background:var(--s2); color:var(--tx2);
    border:1px solid var(--hair); white-space:nowrap; }
  .chip::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor;
    flex:none; opacity:.85; }
  .chip.nodot::before { display:none; }
  .chip-alarm { background:var(--red-dim); color:var(--red); border-color:rgba(255,112,112,.26); }
  .chip-warn { background:var(--glow); color:var(--orange2); border-color:rgba(255,146,76,.26); }
  .chip-good { background:var(--green-dim); color:var(--green); border-color:rgba(61,220,151,.24); }
  .chip-accent { background:rgba(49,73,107,.4); color:#b9cbe2; border-color:var(--hair2); }

  .empty { color:var(--tx3); font-size:13.5px; }
  .muted { color:var(--tx2); }
  .note-line { color:var(--tx3); font-size:12px; margin:14px 0 0; line-height:1.55; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ───────────────────────── streak ring ───────────────────────── */
  .runbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .ring { position:relative; width:58px; height:58px; flex:none; }
  .ring svg { transform:rotate(-90deg); display:block; }
  .ring .label { position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:-.03em; }
  .runmeta .big { font-family:var(--display); font-weight:800; font-size:17px;
    letter-spacing:-.02em; }
  .runmeta .sub { font-size:12.5px; color:var(--tx3); margin-top:1px; }

  /* ───────────────────────── tool cards ───────────────────────── */
  .toolgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px; }
  .toolcard { border:1px solid var(--hair); border-radius:12px; background:var(--s2);
    padding:15px 16px; display:flex; flex-direction:column; gap:9px; }
  .toolcard:hover { border-color:rgba(255,255,255,.17); background:var(--s3); }
  .toolcard.done { border-color:rgba(61,220,151,.28);
    background:linear-gradient(180deg, var(--green-dim), transparent 70%), var(--s2); }
  .toolcard .tname { font-weight:600; font-size:14.5px; letter-spacing:-.008em; }
  .toolcard .tmeta { font-size:12px; color:var(--tx3); }
  .toolcard .tout { font-size:12px; color:var(--tx2); flex:1 1 auto; }
  .toolcard .trow { display:flex; align-items:center; justify-content:space-between; gap:10px; }

  /* ───────────────────────── work queue ───────────────────────── */
  .qgroup { margin-bottom:26px; }
  .qgroup:last-child { margin-bottom:0; }
  .qhead { display:flex; align-items:center; gap:9px; font-size:10px; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; color:var(--tx3); margin-bottom:11px; }
  .qhead .n { font-family:var(--mono); background:var(--s2); border:1px solid var(--hair);
    padding:1px 7px; border-radius:20px; letter-spacing:.02em; }
  .qhead.crit { color:var(--red); }
  .qhead.crit .n { background:var(--red-dim); border-color:rgba(255,112,112,.26); }

  .qitem { display:flex; align-items:center; gap:14px; padding:13px 15px; border-radius:11px;
    background:var(--s2); border:1px solid var(--hair); margin-bottom:8px; }
  .qitem:last-child { margin-bottom:0; }
  .qitem:hover { background:var(--s3); border-color:rgba(255,255,255,.16); }
  .qitem .rail { width:3px; align-self:stretch; border-radius:3px; background:var(--steel);
    flex:none; }
  .qitem.crit .rail { background:var(--red); box-shadow:0 0 11px rgba(255,112,112,.55); }
  .qitem.warn .rail { background:var(--orange); box-shadow:0 0 11px var(--glow); }
  .qitem .grow { flex:1 1 auto; min-width:0; }
  .qitem .qaddr { font-weight:600; font-size:14.5px; letter-spacing:-.008em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qitem .qmeta { font-size:12.5px; color:var(--tx3); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qitem .qacts { display:flex; gap:7px; flex:none; }
  .qdays { font-family:var(--mono); font-size:11px; color:var(--red); flex:none;
    background:var(--red-dim); border:1px solid rgba(255,112,112,.24); padding:3px 8px;
    border-radius:7px; }

  /* ───────────────────────── juan / compliance ───────────────────────── */
  .juan { display:flex; gap:14px; padding:15px 16px; border-radius:12px; background:var(--s2);
    border:1px solid var(--hair); margin-bottom:9px; }
  .juan:last-child { margin-bottom:0; }
  .juan .rail { width:3px; align-self:stretch; border-radius:3px; background:var(--orange);
    flex:none; }
  .juan.compliance { background:linear-gradient(96deg, rgba(255,112,112,.12),
    rgba(255,112,112,.03) 55%, transparent), var(--s2);
    border-color:rgba(255,112,112,.3); }
  .juan.compliance .rail { background:var(--red); box-shadow:0 0 13px rgba(255,112,112,.65); }
  .juan .grow { min-width:0; flex:1 1 auto; }
  .juan .jhead { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .juan .jaddr { font-weight:600; font-size:14.5px; }
  .juan .jnote { font-size:13px; color:var(--tx2); margin-top:7px;
    border-left:2px solid var(--hair2); padding-left:11px; }

  /* ───────────────────────── tables ───────────────────────── */
  .scroll { overflow-x:auto; border-radius:11px; border:1px solid var(--hair); }
  table.data { border-collapse:collapse; width:100%; font-size:13px; }
  table.data th, table.data td { text-align:left; padding:11px 14px; white-space:nowrap;
    border-bottom:1px solid var(--hair); }
  table.data th { font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--tx3); background:var(--s2); }
  table.data td.n, table.data th.n { text-align:right; }
  table.data td.n { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  table.data tr:last-child td { border-bottom:none; }
  table.data tbody tr:hover { background:var(--s2); }
  table.data td.rank { font-family:var(--display); font-weight:800; color:var(--tx3);
    font-size:12px; }

  /* ───────────────────────── KPI ───────────────────────── */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:13px;
    margin-top:22px; }
  .kpi { position:relative; border-radius:13px; border:1px solid var(--hair);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 90px),
      var(--s1);
    box-shadow:var(--panel-shadow); padding:18px 19px; margin:0; overflow:hidden; }
  .kpi:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.15); }
  .kpi dt { font-size:9.5px; font-weight:700; letter-spacing:.17em; text-transform:uppercase;
    color:var(--tx3); }
  .kpi dd { margin:9px 0 0; font-family:var(--display); font-weight:900; font-size:33px;
    line-height:1; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
  .kpi .cap { font-size:11.5px; color:var(--tx3); margin-top:7px; }
  .kpi.is-good dd { color:var(--green); }
  .kpi.is-crit dd { color:var(--red); }
  .kpi.is-accent dd { color:var(--orange); }

  /* ───────────────────────── pace + funnel ───────────────────────── */
  .bar { height:7px; background:var(--s2); border-radius:5px; overflow:hidden; margin-top:15px;
    border:1px solid var(--hair); }
  .bar span { display:block; height:100%; border-radius:5px;
    background:linear-gradient(90deg, #2bb87c, var(--green)); }
  .bar.behind span { background:linear-gradient(90deg, #d14b4b, var(--red)); }

  .funnel { display:grid; gap:4px; }
  .frow { display:grid; grid-template-columns:150px 1fr 62px; gap:16px; align-items:center;
    font-size:13px; padding:5px 0; }
  .frow .flab { font-weight:500; color:var(--tx2); }
  .ftrack { background:var(--s2); border-radius:7px; height:26px; overflow:hidden;
    border:1px solid var(--hair); }
  .ftrack span { display:block; height:100%;
    background:linear-gradient(90deg, rgba(49,73,107,.85), #4a6d9c); border-radius:6px; }
  .ftrack.accent span { background:linear-gradient(90deg, #c9702f, var(--orange)); }
  .fval { text-align:right; font-family:var(--mono); font-weight:500; color:var(--tx);
    font-variant-numeric:tabular-nums; }
  .conv { font-size:11px; color:var(--tx3); letter-spacing:.02em; }

  .costgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:11px; }
  .cost { border:1px solid var(--hair); border-radius:11px; background:var(--s2);
    padding:14px 16px; margin:0; }
  .cost dt { font-size:9.5px; color:var(--tx3); font-weight:700; letter-spacing:.15em;
    text-transform:uppercase; }
  .cost dd { margin:7px 0 0; font-size:21px; font-family:var(--display); font-weight:800;
    letter-spacing:-.035em; font-variant-numeric:tabular-nums; }

  /* ───────────────────────── board ───────────────────────── */
  .tally { display:flex; flex-wrap:wrap; gap:10px; }
  .controls { display:flex; flex-wrap:wrap; gap:11px; align-items:center; margin-top:18px; }
  .controls select { width:auto; min-width:166px; flex:0 1 auto; }
  .controls input[type=text] { flex:1 1 230px; min-width:190px; }

  .lead { border:1px solid var(--hair); border-radius:var(--r); margin-top:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0) 110px),
      var(--s1);
    box-shadow:var(--panel-shadow); overflow:hidden; }
  .lead:hover { border-color:rgba(255,255,255,.15); }
  .lead.flagged { border-color:rgba(255,146,76,.3); }
  .lead.compliance { border-color:rgba(255,112,112,.36); }
  .lead.compliance::before { content:""; display:block; height:2px;
    background:linear-gradient(90deg, var(--red), rgba(255,112,112,0)); }

  .lead-head { padding:18px 20px 14px; }
  .lead-addr { font-family:var(--display); font-size:19px; font-weight:800; letter-spacing:-.03em;
    line-height:1.18; }
  .lead-sub { font-size:12.5px; color:var(--tx3); margin-top:4px; }
