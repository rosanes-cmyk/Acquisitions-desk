<script>
/**
 * Scripts.html - the browser half of the desk.
 *
 * Every read and every write goes through api() on the server (4.2). The
 * prototype's browser-side store is gone entirely, and localStorage holds no
 * company data: it keeps the last tab and nothing else (rule 1.4). A plain
 * grep across src/ for that old global returns nothing, which is how 9.5 asks
 * for the migration to be proved.
 */
var THB = (function () {
  'use strict';

  var S = {
    boot: null,
    tab: 'today',
    data: {},
    server: {},        // last server value per control, for the dirty check (5.6)
    stamp: '',
    pollTimer: null,
    updatesPending: false,
    queues: {},        // per-record write chains, so patches arrive in order (5.2)
    board: { filter: 'live', sort: 'next_action', search: '', open: {} }
  };

  var CALL_TIMEOUT_MS = 45000;

  /* =============================== api client =============================== */

  /**
   * call(action, payload) -> Promise<envelope> (5.2).
   * Never rejects on a server-side failure: the envelope carries the outcome, so
   * every caller handles success and failure the same way.
   */
  function call(action, payload) {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        resolve({ ok: false, code: 'SERVER_ERROR',
          message: 'No response — check your connection and try again.' });
      }, CALL_TIMEOUT_MS);

      function finish(envelope) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (envelope && envelope.changeStamp) S.stamp = envelope.changeStamp;
        resolve(envelope);
      }

      google.script.run
        .withSuccessHandler(finish)
        .withFailureHandler(function (err) {
          var text = (err && err.message) ? String(err.message) : 'Something went wrong.';
          // A dropped Apps Script session looks like an authorization failure.
          if (/authoriz|permission|session|login/i.test(text)) {
            finish({ ok: false, code: 'ACCESS_DENIED',
              message: 'Your session expired. Reload the page.' });
          } else {
            finish({ ok: false, code: 'SERVER_ERROR', message: text });
          }
        })
        .api(action, payload || {});
    });
  }

  /** Serialises writes per record so two patches cannot land out of order (5.2). */
  function queued(key, work) {
    var previous = S.queues[key] || Promise.resolve();
    var next = previous.then(work, work);
    S.queues[key] = next.catch(function () {});
    return next;
  }

  /** Idempotency key for note, attempt, run and import actions (4.5). */
  function requestId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  /* ================================ helpers ================================ */

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function money(n) {
    if (n === null || n === undefined || n === '') return '—';
    var v = Math.round(n);
    return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US');
  }
  function dash(n, digits) {
    if (n === null || n === undefined) return '—';
    return Number(n).toFixed(digits === undefined ? 0 : digits);
  }
  function pct(n) { return (n === null || n === undefined) ? '—' : Math.round(n * 100) + '%'; }
  function blank(n) { return (n === null || n === undefined || n === '') ? '' : n; }

  function opts(list, selected) {
    return list.map(function (o) {
      var v = typeof o === 'string' ? o : o.v;
      var l = typeof o === 'string' ? o : o.l;
      return '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' +
        esc(l === '' ? '(not set)' : l) + '</option>';
    }).join('');
  }

  function el(id) { return document.getElementById(id); }
  function view() { return el('view'); }

  var indicatorTimer = null;
  function indicate(text, cls) {
    var node = el('saveind');
    node.textContent = text;
    node.className = 'saveind ' + (cls || '');
    clearTimeout(indicatorTimer);
    indicatorTimer = setTimeout(function () {
      node.textContent = 'v' + (S.boot ? S.boot.appVersion : '');
      node.className = 'saveind';
    }, 2400);
  }

  function toast(message, alarm) {
    el('toasts').innerHTML = '<div class="toast' + (alarm ? ' alarm' : '') + '">' +
      esc(message) + '</div>';
    setTimeout(function () { el('toasts').innerHTML = ''; }, alarm ? 7000 : 2800);
  }

  /** Turns any failed envelope into the right message for the user (5.5). */
  function reportFailure(envelope) {
    if (envelope.code === 'CONFLICT_RECORD_CHANGED') {
      indicate('Conflict', 'bad');
      toast(envelope.message, true);
    } else if (envelope.code === 'ACCESS_DENIED') {
      indicate('Denied', 'bad');
      toast(envelope.message, true);
    } else if (envelope.code === 'VALIDATION_ERROR') {
      indicate('Rejected', 'bad');
      toast(envelope.message, true);
    } else {
      indicate('Failed', 'bad');
      toast(envelope.message, true);
    }
  }

  function can(capability) {
    return !!(S.boot && S.boot.permissions && S.boot.permissions[capability]);
  }

  function remember(key, value) {
    try { localStorage.setItem('thb:' + key, value); } catch (err) { /* private window */ }
  }
  function recall(key) {
    try { return localStorage.getItem('thb:' + key); } catch (err) { return null; }
  }

  /* ============================ focus protection ============================ */

  /**
   * 5.6 / 5.7 - never re-render a list while an input inside it has focus or
   * text that has not been saved. The prototype re-rendered the whole lead list
   * after every save, which threw away focus, scroll and half-typed notes.
   */
  function isBusyTyping() {
    var active = document.activeElement;
    if (!active || !view().contains(active)) return false;
    var tag = active.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
    if (active.type === 'button' || active.type === 'submit') return false;
    return true;
  }

  function showUpdatesChip() {
    if (S.updatesPending) return;
    S.updatesPending = true;
    el('updates').innerHTML = '<div class="updates">Someone else changed something.' +
      '<button type="button" id="applyupdates">Show it</button></div>';
  }
  function clearUpdatesChip() {
    S.updatesPending = false;
    el('updates').innerHTML = '';
  }

  /* ================================= tabs ================================= */

  var TABS = [
    { id: 'today', label: 'Today' },
    { id: 'numbers', label: 'Numbers' },
    { id: 'board', label: 'Lead Board' },
    { id: 'tools', label: 'Tools We Own' },
    { id: 'plan', label: 'The Plan' },
    { id: 'admin', label: 'Admin', capability: 'manageUsers' }
  ];

  function paintTabs() {
    el('tabs').innerHTML = TABS.filter(function (t) {
      return !t.capability || can(t.capability);
    }).map(function (t) {
      return '<button class="tab" type="button" role="tab" data-tab="' + t.id +
        '" aria-selected="' + (S.tab === t.id) + '">' + esc(t.label) + '</button>';
    }).join('');
  }

  /** Loads the visible tab's data, then paints it. */
  function loadTab(keepScroll) {
    var scrollTop = keepScroll ? window.scrollY : 0;
    paintTabs();

    var loaders = {
      today: function () { return call('getTodayDashboard'); },
      numbers: function () { return call('getNumbersDashboard'); },
      board: function () {
        return call('listLeads', { filter: S.board.filter, sort: S.board.sort,
          search: S.board.search });
      },
      tools: function () { return call('getTools'); },
      plan: function () { return Promise.resolve({ ok: true, data: null }); },
      admin: function () { return THB.views.admin ? THB.views.admin.load() :
        Promise.resolve({ ok: true, data: null }); }
    };

    var painters = {
      today: paintToday, numbers: paintNumbers, board: paintBoard,
      tools: paintTools, plan: paintPlan,
      admin: function (d) { return THB.views.admin ? THB.views.admin.paint(d) : ''; }
    };

    if (!keepScroll) view().innerHTML = '<div class="skeleton">Loading…</div>';

    return (loaders[S.tab] || loaders.today)().then(function (envelope) {
      if (!envelope.ok) {
        view().innerHTML = '<div class="panel"><div class="panel-body">' +
          '<p class="empty">' + esc(envelope.message) + '</p>' +
          '<button class="btn" type="button" id="retrytab">Try again</button></div></div>';
        return;
      }
      S.data[S.tab] = envelope.data;
      clearUpdatesChip();
      view().innerHTML = (painters[S.tab] || paintToday)(envelope.data);
      if (keepScroll) window.scrollTo(0, scrollTop);
      remember('tab', S.tab);
    });
  }

  /* ================================= Today ================================= */

  var METRIC_FIELDS = [
    ['tv_spend', 'TV spend'], ['ppc_spend', 'PPC spend'], ['ppl_spend', 'PPL spend'],
    ['other_spend', 'Other spend'], ['new_leads', 'New leads'], ['inbound_calls', 'Inbound calls'],
    ['missed_calls', 'Missed calls'], ['sellers_reached', 'Sellers reached'],
    ['appointments_set', 'Appts set'], ['contracts_signed', 'Contracts'],
    ['contracts_fell_out', 'Fell out'], ['deals_closed', 'Deals closed'],
    ['minutes_to_first_call', 'Mins to 1st call']
  ];

  function paintToday(d) {
    var m = d.metricsToday;
    var data = m.data || {};
    var spendToday = (Number(data.tv_spend) || 0) + (Number(data.ppc_spend) || 0) +
      (Number(data.ppl_spend) || 0) + (Number(data.other_spend) || 0);
    var overdue = (d.workQueue.overdue || []).length;

    var html = '';

    /* The day, at a glance, before any form. */
    html += '<div class="daystrip">';
    html += '<div class="date"><div class="dow">' + esc(d.businessTodayLabel) + '</div>' +
      '<div class="tz">' + esc(d.businessToday) + ' · ' + esc(S.boot.timezone) +
      ' · the company day</div></div>';
    html += dsFig('Spend today', money(spendToday), 'accent');
    html += dsFig('New leads', data.new_leads === null || data.new_leads === undefined ||
      data.new_leads === '' ? '—' : data.new_leads, '');
    html += dsFig('Overdue', overdue, overdue ? 'crit' : 'good');
    html += dsFig('Tools run', d.dailyToolsDone + '<span class="u">/ ' + d.dailyToolsTotal +
      '</span>', d.dailyToolsTotal && d.dailyToolsDone === d.dailyToolsTotal ? 'good' : '');
    html += '</div>';

    /* The daily log, grouped. Thirteen identical boxes in a row is a form, not a tool. */
    html += '<div class="panel"><h2>Today’s log</h2><div class="panel-body">';
    html += m.logged
      ? '<p class="note-line" style="margin:0 0 18px">Logged by <b style="color:var(--tx)">' +
        esc(m.logged_by) + '</b>. Saving again updates the same row.</p>'
      : '<p class="note-line" style="margin:0 0 18px;color:var(--orange)">' +
        'Today has not been logged yet.</p>';

    html += logGroup('Marketing spend', [['tv_spend', 'TV'], ['ppc_spend', 'PPC'],
      ['ppl_spend', 'PPL'], ['other_spend', 'Other']], data,
      '<span class="live" id="spendlive"><small>Total</small>' + money(spendToday) + '</span>');
    html += logGroup('Calls and contacts', [['inbound_calls', 'Inbound answered'],
      ['missed_calls', 'Missed'], ['sellers_reached', 'Sellers reached'],
      ['minutes_to_first_call', 'Mins to 1st call']], data, '');
    html += logGroup('Outcomes', [['new_leads', 'New leads'], ['appointments_set', 'Appts set'],
      ['contracts_signed', 'Contracts'], ['contracts_fell_out', 'Fell out'],
      ['deals_closed', 'Deals closed']], data, '');

    html += '<p class="note-line">A blank box means not entered — it is not a zero. A blank ' +
      'speed-to-first-call is left out of the average rather than dragging it down.</p>';
    html += '<div style="margin-top:18px;display:flex;gap:12px;align-items:center">' +
      '<button class="btn btn-primary" type="button" id="savetoday" data-version="' +
      esc(m.version) + '">Save today</button>' +
      '<span class="state-msg" id="todaystate"></span></div>';
    html += '</div></div>';

    /* Tools due today. */
    html += '<div class="panel"><h2>Tools that have to run today</h2><div class="panel-body">';
    html += '<div class="runbar">' + ring(d.dailyToolsDone, d.dailyToolsTotal) +
      '<div class="runmeta"><div class="big">' + d.dailyToolsDone + ' of ' + d.dailyToolsTotal +
      ' run today</div><div class="sub">' +
      (d.streak > 1 ? d.streak + ' days in a row — weekends do not break a weekday-only streak'
                    : 'No streak running yet') + '</div></div></div>';
    html += d.dailyTools.length
      ? '<div class="toolgrid">' + d.dailyTools.map(function (t) {
          return '<div class="toolcard' + (t.done ? ' done' : '') + '">' +
            '<div class="trow"><span class="tname">' + esc(t.name) + '</span>' +
            (t.done ? '<span class="chip chip-good nodot">done</span>' : '') + '</div>' +
            '<div class="tmeta">' + esc(t.operator || 'no owner set') +
            (t.done ? ' · done by ' + esc(t.done_by) : '') + '</div>' +
            '<div class="tout">' + esc(t.expected_output || '') + '</div>' +
            '<div class="trow"><span></span><button class="btn btn-sm' +
            (t.done ? '' : ' btn-primary') + '" type="button" data-run="' + esc(t.tool_id) +
            '" data-done="' + (t.done ? '1' : '0') + '">' + (t.done ? 'Undo' : 'Mark run') +
            '</button></div></div>';
        }).join('') + '</div>'
      : '<p class="empty">No tools are due today.</p>';
    html += '</div></div>';

    /* Work queue, as a priority stack. */
    html += '<div class="panel"><h2>Work queue</h2><div class="panel-body">';
    var sections = [['overdue', 'Overdue', 'crit'], ['dueToday', 'Due today', 'warn'],
      ['upcoming', 'Upcoming', ''], ['noNextAction', 'No next action', ''],
      ['noDueDate', 'No due date', '']];
    var any = false;
    sections.forEach(function (section) {
      var rows = d.workQueue[section[0]] || [];
      if (!rows.length) return;
      any = true;
      html += '<div class="qgroup"><div class="qhead' + (section[2] === 'crit' ? ' crit' : '') +
        '">' + esc(section[1]) + '<span class="n">' + rows.length + '</span></div>';
      html += rows.map(function (l) {
        return '<div class="qitem ' + section[2] + '"><span class="rail"></span>' +
          '<div class="grow"><div class="qaddr">' + esc(l.address) + '</div>' +
          '<div class="qmeta">' + esc(l.next_action || 'No next action set') + ' · ' +
          esc(l.assignee_name || 'unassigned') + '</div></div>' +
          (l.days_overdue ? '<span class="qdays">' + l.days_overdue + 'd late</span>' : '') +
          '<div class="qacts">' +
          '<button class="btn btn-sm" type="button" data-complete="' + esc(l.lead_id) +
          '" data-version="' + esc(l.version) + '">Mark done</button>' +
          '<button class="btn btn-sm" type="button" data-goto="' + esc(l.address) +
          '">Open</button></div></div>';
      }).join('') + '</div>';
    });
    if (!any) html += '<p class="empty">Nothing waiting. The board is clear.</p>';
    html += '</div></div>';

    /* Waiting on Juan. Compliance has to be unmistakable (6.2). */
    html += '<div class="panel"><h2>Waiting on Juan</h2><div class="panel-body">';
    html += d.waitingOnJuan.length ? d.waitingOnJuan.map(function (l) {
      return '<div class="juan' + (l.compliance_mailer_check ? ' compliance' : '') + '">' +
        '<span class="rail"></span><div class="grow"><div class="jhead">' +
        '<span class="jaddr">' + esc(l.address) + '</span>' +
        (l.compliance_mailer_check
          ? '<span class="chip chip-alarm">Mailer or check mentioned</span>'
          : '<span class="chip chip-warn">Flagged</span>') +
        '<span class="chip nodot">' + esc(l.status_label) + '</span>' +
        '<span class="chip nodot">' + esc(l.assignee_name || 'unassigned') + '</span>' +
        '<span class="mono" style="font-size:11px;color:var(--tx3)">flagged ' +
        esc((l.flagged_at || '').slice(0, 10) || '—') + '</span></div>' +
        (l.latest_note ? '<div class="jnote">' + esc(l.latest_note) + '</div>' : '') +
        '</div></div>';
    }).join('') : '<p class="empty">Nobody is waiting on Juan.</p>';
    html += '</div></div>';

    html += '<div class="panel"><h2>Who worked the board today</h2><div class="panel-body">' +
      paintSnapshot(d.teamActivity) + '</div></div>';
    return html;
  }

  function dsFig(label, value, tone) {
    return '<dl class="dsfig"><dt>' + esc(label) + '</dt><dd class="' + (tone || '') + '">' +
      value + '</dd></dl>';
  }

  function logGroup(title, fields, data, live) {
    var html = '<div class="loggroup"><div class="loghead"><h3>' + esc(title) + '</h3>' +
      (live || '') + '</div><div class="fieldgrid">';
    html += fields.map(function (f) {
      var value = blank(data[f[0]]);
      S.server['metric:' + f[0]] = String(value);
      return '<div><label class="field" for="m-' + f[0] + '">' + esc(f[1]) + '</label>' +
        '<input type="number" min="0" id="m-' + f[0] + '" data-metric="' + f[0] + '" value="' +
        esc(value) + '"></div>';
    }).join('');
    return html + '</div></div>';
  }

  /** Donut for the day's tool completion. */
  function ring(done, total) {
    var share = total ? done / total : 0;
    var radius = 25;
    var circumference = 2 * Math.PI * radius;
    var colour = total && done === total ? 'var(--green)' : 'var(--orange)';
    return '<div class="ring"><svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true">' +
      '<circle cx="29" cy="29" r="' + radius + '" fill="none" stroke="var(--s3)" ' +
      'stroke-width="5"/><circle cx="29" cy="29" r="' + radius + '" fill="none" stroke="' +
      colour + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + circumference +
      '" stroke-dashoffset="' + (circumference * (1 - share)) + '"/></svg>' +
      '<span class="label">' + (total ? Math.round(share * 100) : 0) + '</span></div>';
  }

  function paintSnapshot(activity) {
    var rows = (activity && activity.rows) || [];
    if (!rows.length) return '<p class="empty">Nobody has touched the board today.</p>';
    var detailed = !!(activity && activity.detailed);

    var head = '<tr><th>Person</th><th class="n">Leads touched</th><th class="n">Attempts</th>' +
      '<th class="n">Notes</th><th class="n">Status changes</th>' +
      (detailed ? '<th class="n">Appts</th><th class="n">Contracts</th><th class="n">Closes</th>' +
        '<th class="n">Assigned</th><th class="n">Overdue</th><th>Last activity</th>' : '') +
      '</tr>';
    var body = rows.map(function (u) {
      return '<tr><td>' + esc(u.name) + '</td><td class="n">' + u.leadsTouched +
        '</td><td class="n">' + u.attempts + '</td><td class="n">' + u.notes +
        '</td><td class="n">' + u.statusChanges + '</td>' +
        (detailed ? '<td class="n">' + u.appointmentsSet + '</td><td class="n">' + u.contracts +
          '</td><td class="n">' + u.closes + '</td><td class="n">' + u.activeAssigned +
          '</td><td class="n">' + u.overdueAssigned + '</td><td class="mono">' +
          esc(String(u.lastActivityAt).slice(11, 16)) + '</td>' : '') + '</tr>';
    }).join('');

    return '<div class="scroll"><table class="data"><thead>' + head + '</thead><tbody>' + body +
      '</tbody></table></div>' + (detailed ? '' : '<p class="note-line">The full snapshot — ' +
      'appointments, contracts, closes and last activity — is manager and admin only.</p>');
  }

  /* ================================ Numbers ================================ */

  function paintNumbers(d) {
    var f = d.funnel, c = d.costs, p = d.pace;
    var maxF = Math.max(f.newLeads, f.inboundCalls, f.sellersReached, f.appointments,
      f.contracts, f.closed, 1);

    var html = '<div class="kpis">';
    html += '<dl class="kpi ' + (p.ahead ? 'is-good' : 'is-crit') + '"><dt>Closed this month</dt>' +
      '<dd>' + p.closed + '</dd><div class="cap">of ' + p.target + '</div></dl>';
    html += '<dl class="kpi"><dt>Spend, last 30 days</dt><dd>' + money(c.spend) +
      '</dd><div class="cap">' + d.daysLoggedInWindow + ' days logged</div></dl>';
    html += '<dl class="kpi"><dt>Cost per closed deal</dt><dd>' + money(c.perClosedDeal) +
      '</dd><div class="cap">' + (c.perClosedDeal === null ? 'no closings in the window'
        : f.closed + ' closed in 30 days') + '</div></dl>';
    html += '<dl class="kpi"><dt>Speed to first call</dt><dd>' +
      (c.averageSpeedToFirstCall === null ? '—' : dash(c.averageSpeedToFirstCall, 1)) +
      '</dd><div class="cap">' + (c.averageSpeedToFirstCall === null ? 'nothing entered'
        : 'minutes, blank days excluded') + '</div></dl>';
    html += '</div>';

    html += '<div class="panel"><h2>Pace this month</h2><div class="panel-body"><div class="pace">' +
      '<div style="flex:1 1 100%"><div class="muted" style="font-size:14px">' + esc(p.message) +
      '</div><div class="bar' + (p.ahead ? '' : ' behind') + '"><span style="width:' +
      p.barPercent + '%"></span></div>' +
      '<div class="muted" style="font-size:13px;margin-top:10px">Spent ' + money(d.monthSpend) +
      ' this month of a ' + money(d.monthlyMarketingBudget) + ' budget</div></div></div>';

    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:flex-end">' +
      '<div><label class="field" for="t-target">Monthly deal target</label>' +
      '<input type="number" min="0" id="t-target" value="' + esc(d.monthlyDealTarget) + '"' +
      (d.canSaveTargets ? '' : ' disabled') + '></div>' +
      '<div><label class="field" for="t-budget">Monthly budget</label>' +
      '<input type="number" min="0" id="t-budget" value="' + esc(d.monthlyMarketingBudget) + '"' +
      (d.canSaveTargets ? '' : ' disabled') + '></div>' +
      (d.canSaveTargets
        ? '<button class="btn btn-primary" type="button" id="savetargets">Save targets</button>'
        : '<span class="chip chip-warn">Managers and admins only</span>') + '</div>';
    html += '</div></div>';

    html += '<div class="panel"><h2>Last 30 days</h2><div class="panel-body">';
    html += '<p class="note-line" style="margin:0 0 16px">' + d.daysLoggedInWindow +
      ' days logged in the last 30.</p><div class="funnel">';
    var steps = [['New leads', f.newLeads, null], ['Inbound calls', f.inboundCalls, null],
      ['Sellers reached', f.sellersReached, f.conversions.reachedOfNew],
      ['Appointments', f.appointments, f.conversions.appointmentsOfReached],
      ['Contracts', f.contracts, f.conversions.contractsOfAppointments],
      ['Closed', f.closed, f.conversions.closedOfContracts]];
    steps.forEach(function (s) {
      html += '<div class="frow"><div class="flab">' + esc(s[0]) + '</div>' +
        '<div class="ftrack"><span style="width:' + Math.max(2, s[1] / maxF * 100) +
        '%"></span></div><div class="fval">' + s[1] + '</div></div>';
      if (s[2] !== null && s[2] !== undefined) {
        html += '<div class="frow"><div></div><div class="conv">' + pct(s[2]) +
          ' carried through</div><div></div></div>';
      }
    });
    html += '</div>';

    var cells = [['Spend', money(c.spend)], ['Per lead', money(c.perLead)],

  function leadCard(l) {
    var enums = S.boot.enums;

    var archived = enums.statuses.some(function (s) {
      return s.value === l.status && s.archived; });
    var live = enums.statuses.some(function (s) { return s.value === l.status && s.live; });
    var overdue = live && l.due_date && l.due_date < today;
    var id = l.lead_id;

    var chips = ['<span class="chip nodot">' + esc(l.status_label) + '</span>'];
    if (l.compliance_mailer_check) {
      chips.push('<span class="chip chip-alarm">Mailer or check — route to Juan</span>');
    }
    if (l.flag_juan && !l.compliance_mailer_check) {
      chips.push('<span class="chip chip-warn">Needs Juan</span>');
    }
    if (overdue) chips.push('<span class="chip chip-alarm">Overdue</span>');
    if (l.is_stale && l.days_untouched !== null) {
      chips.push('<span class="chip chip-warn">' + l.days_untouched + 'd untouched</span>');
    }
    if (l.contact_attempts) {
      chips.push('<span class="chip nodot">' + l.contact_attempts + ' attempts</span>');
    }
    if (l.possible_duplicate_of) {
      chips.push('<span class="chip chip-warn">Possible duplicate</span>');

    ['status', 'assigned_to', 'next_action', 'due_date', 'arv', 'repairs', 'asking_price',
      'offer', 'appointment_date', 'appointment_time', 'appointment_outcome'].forEach(function (f) {
        S.server[id + ':' + f] = String(blank(l[f]));

  /* ================================ writes ================================ */

  function cardVersion(leadId) {
    var card = view().querySelector('[data-card="' + leadId + '"]');
    return card ? Number(card.dataset.version) : null;
  }

  function cardState(leadId, message, cls) {
    var node = el('st-' + leadId);
    if (!node) { indicate(message, cls === 'saved' ? 'ok' : 'bad'); return; }
    node.textContent = message;
    node.className = 'state-msg show ' + cls;
    if (cls === 'saved') {
      setTimeout(function () { node.className = 'state-msg'; }, 2200);
    }
  }

  /** Applies the server's returned record, never the optimistic local copy (5.2). */
  function applyLead(record) {
    var card = view().querySelector('[data-card="' + record.lead_id + '"]');
    if (!card) return;
    var replacement = document.createElement('div');
    replacement.innerHTML = leadCard(record);
    card.replaceWith(replacement.firstChild);
  }

  function writeLead(leadId, action, payload, label) {
    indicate('Saving…', 'on');
    cardState(leadId, 'Saving…', 'saving');
    return queued(leadId, function () {
      return call(action, payload).then(function (envelope) {
        if (envelope.ok) {
          indicate('Saved', 'ok');
          cardState(leadId, 'Saved', 'saved');
          if (envelope.data && envelope.data.lead_id) applyLead(envelope.data);
          return envelope;
        }
        if (envelope.code === 'CONFLICT_RECORD_CHANGED') {
          cardState(leadId, 'Changed by another user — reload this lead', 'error');
          if (envelope.data && envelope.data.lead_id) applyLead(envelope.data);
          indicate('Conflict', 'bad');
          toast(envelope.message, true);
          return envelope;
        }
        cardState(leadId, envelope.code === 'ACCESS_DENIED' ? 'Access denied'
          : 'Could not save', 'error');
        reportFailure(envelope);
        return envelope;
      });
    });
  }

  /* ================================ events ================================ */

  function wireGlobal() {
    el('tabs').addEventListener('click', function (e) {
      var button = e.target.closest('[data-tab]');
      if (!button) return;
      S.tab = button.dataset.tab;
      loadTab(false);
    });

    el('refresh').addEventListener('click', function () { loadTab(true); });

    el('updates').addEventListener('click', function (e) {
      if (e.target.id === 'applyupdates') { clearUpdatesChip(); loadTab(true); }
    });

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) schedulePoll();
    });
  }

  function wireView() {
    var node = view();

    node.addEventListener('click', function (e) {
      var t = e.target;

      if (t.id === 'retrytab') { loadTab(false); return; }

      var run = t.closest('[data-run]');
      if (run) {
        var done = run.dataset.done === '1';
        indicate('Saving…', 'on');
        call(done ? 'voidToolRun' : 'logToolRun',
          { toolId: run.dataset.run, client_request_id: requestId() })
          .then(function (env) {
            if (env.ok) { indicate('Saved', 'ok'); loadTab(true); } else { reportFailure(env); }
          });
        return;
      }

      var complete = t.closest('[data-complete]');
      if (complete) {
        var leadId = complete.dataset.complete;
        indicate('Saving…', 'on');
        call('completeNextAction', { leadId: leadId,
          expectedVersion: Number(complete.dataset.version) })
          .then(function (env) {
            if (env.ok) { indicate('Saved', 'ok'); loadTab(true); } else { reportFailure(env); }
          });
        return;
      }

      var goTo = t.closest('[data-goto]');
      if (goTo) {
        S.tab = 'board';
        S.board.filter = 'everything';
        S.board.search = goTo.dataset.goto;
        loadTab(false);
        return;
      }

      var attempt = t.closest('[data-attempt]');
      if (attempt) {
        var aid = attempt.dataset.attempt;
        writeLead(aid, 'logAttempt',
          { leadId: aid, expectedVersion: cardVersion(aid), client_request_id: requestId() });
        return;
      }

      var juan = t.closest('[data-juan]');
      if (juan) {
        var jid = juan.dataset.juan;
        writeLead(jid, 'setJuanFlag',
          { leadId: jid, on: juan.dataset.on === '1', expectedVersion: cardVersion(jid) });
        return;
      }

      var comply = t.closest('[data-comply]');
      if (comply) {
        var cid = comply.dataset.comply;
        writeLead(cid, 'setComplianceFlag',
          { leadId: cid, on: comply.dataset.on === '1', expectedVersion: cardVersion(cid) });
        return;
      }

      var restore = t.closest('[data-restore]');
      if (restore) {
        var rid = restore.dataset.restore;
        writeLead(rid, 'restoreLead',
          { leadId: rid, toStatus: 'NEW', expectedVersion: cardVersion(rid) })
          .then(function () { loadTab(true); });
        return;
      }

      var post = t.closest('[data-post]');
      if (post) { postNote(post.dataset.post); return; }

      var history = t.closest('[data-history]');
      if (history) {
        var hid = history.dataset.history;
        call('getLeadActivity', { leadId: hid, limit: 200 }).then(function (env) {
          if (!env.ok) { reportFailure(env); return; }
          var rows = env.data.activity.map(function (a) {
            return '<div class="note"><span class="by">' + esc(a.user_name) + ' · ' +
              esc(String(a.timestamp_utc).slice(0, 16).replace('T', ' ')) + ' · ' +
              esc(a.action_type) + '</span><br>' + esc(a.note || (a.field_changed
                ? a.field_changed + ': ' + a.old_value + ' → ' + a.new_value : '')) + '</div>';
          }).join('');
          history.outerHTML = '<div style="margin-top:8px">' +
            (rows || '<p class="empty">No history.</p>') + '</div>';
        });
        return;
      }

      if (t.id === 'toggleadd') {
        var box = el('addbox');
        box.hidden = !box.hidden;
        return;
      }

      if (t.id === 'addleads') { addLeads(); return; }
      if (t.id === 'savetoday') { saveToday(t); return; }
      if (t.id === 'savetargets') { saveTargets(); return; }
    });

    node.addEventListener('change', function (e) {
      var target = e.target;

      if (target.id === 'b-filter') { S.board.filter = target.value; loadTab(false); return; }
      if (target.id === 'b-sort') { S.board.sort = target.value; loadTab(false); return; }

      if (target.dataset.pillar) {
        indicate('Saving…', 'on');
        call('setPillarState', { pillarId: target.dataset.pillar, state: target.value })
          .then(function (env) { env.ok ? indicate('Saved', 'ok') : reportFailure(env); });
        return;
      }

      if (target.dataset.builder) {
        indicate('Saving…', 'on');
        call('setBuilderAsked', { builder: target.dataset.builder, date: target.value })
          .then(function (env) { env.ok ? indicate('Saved', 'ok') : reportFailure(env); });
        return;
      }

      if (target.dataset.lead) { saveLeadField(target); return; }
    });

    // Text inputs commit on blur; selects and dates commit on change.
    node.addEventListener('blur', function (e) {
      if (e.target.dataset && e.target.dataset.lead &&
        (e.target.type === 'text' || e.target.type === 'number')) {
        saveLeadField(e.target);
      }
    }, true);

    node.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      if (e.target.dataset.note) { e.preventDefault(); postNote(e.target.dataset.note); return; }
      if (e.target.dataset.lead) { e.target.blur(); }
    });

    node.addEventListener('input', function (e) {
      if (e.target.id === 'b-search') {
        S.board.search = e.target.value;
        clearTimeout(S.searchTimer);
        S.searchTimer = setTimeout(function () {
          var position = e.target.selectionStart;
          loadTab(true).then(function () {
            var again = el('b-search');
            if (again) { again.focus(); again.setSelectionRange(position, position); }
          });
        }, 400);
      }
    });

    node.addEventListener('toggle', function (e) {
      if (e.target.dataset && e.target.dataset.uwid) {
        S.board.open[e.target.dataset.uwid] = e.target.open;
      }
    }, true);
  }

  /**
   * 5.6 - send a patch only when the value differs from the last server value.
   * The prototype saved on every blur, which in production means a write and an
   * activity row for a field nobody touched.
   */
  function saveLeadField(input) {
    var leadId = input.dataset.lead;
    var field = input.dataset.f;
    var key = leadId + ':' + field;
    var value = input.value;

    if (String(S.server[key]) === String(value)) return;
    S.server[key] = String(value);

    var version = cardVersion(leadId);

    if (field === 'assigned_to') {
      writeLead(leadId, 'assignLead',
        { leadId: leadId, assignedTo: value, expectedVersion: version });
      return;
    }
    if (field === 'next_action' || field === 'due_date') {
      var nextAction = (el('n-' + leadId) || {}).value || '';
      var dueDate = (el('d-' + leadId) || {}).value || '';
      writeLead(leadId, 'setNextAction',
        { leadId: leadId, nextAction: nextAction, dueDate: dueDate, expectedVersion: version });
      return;
    }
    if (field === 'status') {
      var chosen = S.boot.enums.statuses.filter(function (s) { return s.value === value; })[0];
      if (chosen && chosen.archived) {
        writeLead(leadId, 'archiveLead',
          { leadId: leadId, archivedStatus: value, expectedVersion: version })
          .then(function () { loadTab(true); });
        return;
      }
    }

    var patch = {};
    patch[field] = value;
    writeLead(leadId, 'updateLead',
      { leadId: leadId, patch: patch, expectedVersion: version });
  }

  function postNote(leadId) {
    var input = view().querySelector('[data-note="' + leadId + '"]');
    var text = (input.value || '').trim();
    if (!text) { toast('Type a note first.'); return; }
    input.disabled = true;
    writeLead(leadId, 'addLeadNote',
      { leadId: leadId, text: text, client_request_id: requestId() })
      .then(function (envelope) {
        if (envelope.ok) return;
        input.disabled = false;
        input.value = text;   // give the words back
      });
  }

  function saveToday(button) {
    var data = {};
    view().querySelectorAll('[data-metric]').forEach(function (input) {
      data[input.dataset.metric] = input.value === '' ? '' : Number(input.value);
    });
    var state = el('todaystate');
    state.textContent = 'Saving…';
    state.className = 'state-msg show saving';
    indicate('Saving…', 'on');

    call('saveDailyMetrics', { date: S.boot.businessToday, data: data,
      expectedVersion: Number(button.dataset.version) }).then(function (envelope) {
      if (envelope.ok) {
        state.textContent = 'Saved by ' + S.boot.user.name;
        state.className = 'state-msg show saved';
        indicate('Saved', 'ok');
        loadTab(true);
      } else {
        state.textContent = envelope.message;
        state.className = 'state-msg show error';
        reportFailure(envelope);
      }
    });
  }

  function saveTargets() {
    indicate('Saving…', 'on');
    call('saveTargets', {
      monthly_deal_target: el('t-target').value,
      monthly_marketing_budget: el('t-budget').value
    }).then(function (envelope) {
      if (envelope.ok) { indicate('Saved', 'ok'); loadTab(true); } else { reportFailure(envelope); }
    });
  }

  /**
   * 5.8 - the server validates every row and reports what happened to each one.
   * Failed lines go back into the box so they can be corrected and resubmitted.
   */
  function addLeads() {
    var text = el('addtext').value;
    var raw = text.split(/\r\n|\r|\n/);
    var rows = [];
    var seenFirst = false;

    raw.forEach(function (line, index) {
      if (!line.trim()) return;
      var cells = line.split(line.indexOf('\t') >= 0 ? '\t' : ',');
      if (!seenFirst) {
        seenFirst = true;
        if (cells[0].trim().toLowerCase() === 'address') return;
      }
      var extras = cells.slice(5).map(function (c) { return c.trim(); }).filter(Boolean);
      var equity = (cells[4] || '').trim();
      if (extras.length) equity = equity ? equity + ' ' + extras.join(' ') : extras.join(' ');
      rows.push({ line: index + 1, address: (cells[0] || '').trim(),
        seller_name: (cells[1] || '').trim(), phone: (cells[2] || '').trim(),
        source: (cells[3] || '').trim(), equity_note: equity });
    });

    if (!rows.length) { toast('Type at least one lead.'); return; }

    var state = el('addstate');
    state.textContent = 'Adding ' + rows.length + '…';
    state.className = 'state-msg show saving';

    call('addBulkLeads', { rows: rows, client_request_id: requestId() })
      .then(function (envelope) {
        if (!envelope.ok) {
          state.textContent = envelope.message;
          state.className = 'state-msg show error';
          reportFailure(envelope);
          return;
        }
        var s = envelope.data;
        state.textContent = 'Added ' + s.added + ' · Duplicates skipped ' + s.duplicatesSkipped +
          ' · Possible duplicates ' + s.possibleDuplicates + ' · Failed ' + s.failed;
        state.className = 'state-msg show ' + (s.failed ? 'error' : 'saved');

        el('addresult').innerHTML = '<div class="scroll" style="margin-top:12px">' +
          '<table class="data"><thead><tr><th>Line</th><th>Address</th><th>Result</th>' +
          '<th>Why</th></tr></thead><tbody>' + s.rows.map(function (r) {
            return '<tr><td class="mono">' + r.line + '</td><td>' + esc(r.address) + '</td><td>' +
              esc(r.result.replace(/_/g, ' ').toLowerCase()) + '</td><td>' + esc(r.reason) +
              '</td></tr>';
          }).join('') + '</tbody></table></div>';

        // Hand the failed lines back so they can be fixed and resubmitted.
        var failedLines = s.rows.filter(function (r) { return r.result === 'FAILED'; })
          .map(function (r) { return raw[r.line - 1]; });
        el('addtext').value = failedLines.join('\n');
        loadTab(true);
      });
  }

  /* ================================ refresh ================================ */

  /**
   * 5.7 - poll the cheap change stamp, with jitter, paused while the tab is
   * hidden. A change refetches only the visible tab, and never while somebody is
   * typing into it.
   */
  function schedulePoll() {
    clearTimeout(S.pollTimer);
    var base = (S.boot && S.boot.settings.auto_refresh_seconds ?
      S.boot.settings.auto_refresh_seconds : 30) * 1000;
    var jittered = base * (0.8 + Math.random() * 0.4);
    S.pollTimer = setTimeout(poll, jittered);
  }

  function poll() {
    if (document.hidden) { schedulePoll(); return; }
    call('getChangeStamp').then(function (envelope) {
      if (envelope.ok && envelope.data.changeStamp &&
        envelope.data.changeStamp !== S.stamp) {
        S.stamp = envelope.data.changeStamp;
        if (isBusyTyping()) showUpdatesChip(); else loadTab(true);
      }
      schedulePoll();
    });
  }

  /* ================================= start ================================= */

  function start() {
    call('bootstrap').then(function (envelope) {
      if (!envelope.ok) {
        view().innerHTML = '<div class="boot"><h2>The desk could not open</h2>' +
          '<p>' + esc(envelope.message) + '</p>' +
          '<button class="btn btn-primary" type="button" onclick="THB.start()">Try again</button>' +
          '</div>';
        return;
      }

      S.boot = envelope.data;
      S.stamp = S.boot.changeStamp;

      el('whoname').textContent = S.boot.user.name || S.boot.user.email;
      el('whorole').textContent = S.boot.user.role;
      el('saveind').textContent = 'v' + S.boot.appVersion;
      el('daystamp').textContent = S.boot.businessToday + ' · ' + S.boot.timezone;
      if (S.boot.env === 'DEV') el('envbadge').hidden = false;

      var remembered = recall('tab');
      if (remembered && TABS.some(function (t) {
        return t.id === remembered && (!t.capability || can(t.capability));
      })) {
        S.tab = remembered;
      }

      wireGlobal();
      wireView();
      loadTab(false);
      schedulePoll();
    });
  }

  return {
    start: start,
    call: call,
    esc: esc,
    money: money,
    opts: opts,
    indicate: indicate,
    toast: toast,
    reportFailure: reportFailure,
    can: can,
    views: {}
  };
})();
</script>
